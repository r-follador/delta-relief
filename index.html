<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LiDAR Delta-Relief Switzerland</title>

  <!-- MapLibre GL JS (v5) -->
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <style>
    :root{ --control-h:56px; }
    @media (min-width:600px){ :root{ --control-h:50px; } }

    html,body{ margin:0; height:100%; font-family:system-ui,sans-serif; font-size:16px; overscroll-behavior:none; }
    #map{ position:absolute; inset:0; bottom:var(--control-h); transform:translateZ(0); }

    #controls{
      position:absolute; bottom:10px; left:0; width:100%; height:var(--control-h);
      display:flex; gap:.5rem; align-items:center; padding:0 .5rem;
      background:#fafafaCC; border-top:1px solid #ddd; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      box-sizing:border-box; touch-action:none;
    }
    #controls button{
      flex:0 0 auto; min-width:64px; padding:.5rem 1rem;
      font-size:clamp(.9rem,3.5vw,1.1rem); border:1px solid #777; border-radius:6px;
      background:#fff; cursor:pointer; line-height:1.2; user-select:none;
    }
    #controls button.active,
    #controls button:hover:not(#geoBtn){ background:#0066cc; color:#fff; border-color:#0066cc; }
    #geoBtn{ margin-left:auto; font-size:clamp(1.25rem,5vw,1.5rem); line-height:1; padding:.5rem .8rem; }
    #geoBtn:hover{ background:#0066cc; color:#fff; border-color:#0066cc; }
  </style>
</head>
<body>
<div id="map"></div>

<div id="controls">
  <button data-layer="satellite">Satellite</button>
  <button data-layer="map">Map</button>
  <button data-layer="lidar" class="active">LiDAR</button>
  <button id="geoBtn" title="Zoom to my location">🛰️</button>
</div>

<script>

  const minZoom_lidar = 14;
  const minZoom_other = 10;
  const maxZoom_all = 18;
  function getURLCoords(){
    const p = new URLSearchParams(location.search);
    const lat = parseFloat(p.get('lat'));
    const lon = parseFloat(p.get('lon') ?? p.get('lng'));

    if (Number.isFinite(lat) && Number.isFinite(lon)) {
      console.log('URL coords lat lon', lat, lon);
      return [lon, lat];
    }

    const coordsParam = p.get('coords');
    if (coordsParam) {
      const [east, north] = coordsParam.split(',').map(parseFloat);
      if (Number.isFinite(east) && Number.isFinite(north)) {
        const coords = LV95.CHtoWGS(east, north);
        //console.log('URL coords east,north:', east, north);
        //console.log('converted to', coords);
        return [coords.lon, coords.lat];
      }
    }

    return null;
  }

  function shareURL(lon, lat){
    const coordsCH = LV95.WGStoCH(lat, lon);
    const url = `${location.origin}${location.pathname}?coords=${coordsCH.east.toFixed(0)},${coordsCH.north.toFixed(0)}`;
    history.replaceState(null, '', url);
    window.prompt('Share or copy this link', url);
  }

  //Adapted from: https://github.com/ValentinMinder/Swisstopo-WGS84-LV03/blob/master/scripts/js/wgs84_ch1903.js
  const LV95 = {
    WGStoCH(lat, lng) {
      function decToSex(angle) {
        const deg = Math.floor(angle);
        const min = Math.floor((angle - deg) * 60);
        const sec = (((angle - deg) * 60) - min) * 60;
        return sec + min * 60 + deg * 3600;
      }

      const latSex = decToSex(lat);
      const lngSex = decToSex(lng);

      const latAux = (latSex - 169028.66) / 10000;
      const lngAux = (lngSex - 26782.5) / 10000;

      const east =
              600072.37 +
              211455.93 * lngAux -
              10938.51 * lngAux * latAux -
              0.36 * lngAux * Math.pow(latAux, 2) -
              44.54 * Math.pow(lngAux, 3);

      const north =
              200147.07 +
              308807.95 * latAux +
              3745.25 * Math.pow(lngAux, 2) +
              76.63 * Math.pow(latAux, 2) -
              194.56 * Math.pow(lngAux, 2) * latAux +
              119.79 * Math.pow(latAux, 3);

      return { east, north };
    },

    CHtoWGS(east, north) {
      const yAux = (east - 600000) / 1000000;
      const xAux = (north - 200000) / 1000000;

      let lat =
              16.9023892 +
              3.238272 * xAux -
              0.270978 * yAux * yAux -
              0.002528 * xAux * xAux -
              0.0447 * yAux * yAux * xAux -
              0.0140 * xAux * xAux * xAux;

      let lon =
              2.6779094 +
              4.728982 * yAux +
              0.791484 * yAux * xAux +
              0.1306 * yAux * xAux * xAux -
              0.0436 * yAux * yAux * yAux;

      lat = (lat * 100) / 36;
      lon = (lon * 100) / 36;

      return { lon: lon, lat: lat };
    }
  };

  /* ── map style ───────────────────────────────────────────────────────────── */
  const style = {
    version: 8,
    sources: {
      lidar:{ type:'raster', tiles:[
          'https://lidar.cubetrek.com/mbtiles/lidar/tiles/{z}/{x}/{y}.png'
        ], tileSize:256, minzoom:minZoom_lidar, maxzoom:maxZoom_all, attribution:'© swisstopo | Rainer' },
      satellite:{ type:'raster', tiles:[
          'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg'
        ], tileSize:256, minzoom:minZoom_other, maxzoom:maxZoom_all, attribution:'© swisstopo' },
      map:{ type:'raster', tiles:[
          'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg'
        ], tileSize:256, minzoom:minZoom_other, maxzoom:maxZoom_all, attribution:'© swisstopo' }
    },
    layers:[
      {id:'lidar',     type:'raster', source:'lidar',     layout:{visibility:'visible'}},
      {id:'satellite', type:'raster', source:'satellite', layout:{visibility:'none'}},
      {id:'map',       type:'raster', source:'map',       layout:{visibility:'none'}},
    ]
  };

  /* ── map init ────────────────────────────────────────────────────────────── */
  const startPos = getURLCoords() ?? [9.557593, 46.974507];

  const map = new maplibregl.Map({
    container:'map',
    style,
    center:startPos,
    zoom:15,
    minZoom:minZoom_lidar,
    maxZoom:17,
    pitch:0,
    maxPitch:0,
    pitchWithRotate:false            // extra safety
  });

  /* lock north-up and prevent tilt/rotate */
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.on('style.load', ()=> { map.setBearing(0); map.setPitch(0); });

  /* ── layer switch with dynamic minZoom ───────────────────────────────────── */
  document.querySelectorAll('#controls button[data-layer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetLayer = btn.dataset.layer;

      ['satellite', 'map', 'lidar'].forEach(layerId => {
        const isVisible = layerId === targetLayer;
        map.setLayoutProperty(layerId, 'visibility', isVisible ? 'visible' : 'none');
      });

      document.querySelectorAll('#controls button[data-layer]').forEach(b =>
              b.classList.toggle('active', b === btn)
      );

      // Adjust minZoom depending on layer
      if (targetLayer === 'lidar') {
        map.setMinZoom(minZoom_lidar);
        if (map.getZoom() < minZoom_lidar) {
          map.easeTo({ zoom: minZoom_lidar });
        }
      } else {
        map.setMinZoom(minZoom_other);
      }
    });
  });


  /* ── marker logic ───────────────────────────────────────────────────────── */
  let userMarker = null;
  function setMarker(lon, lat){
    if(!userMarker){
      userMarker = new maplibregl.Marker({color:'#d00'})
              .setLngLat([lon, lat])
              .addTo(map);
    }else{
      userMarker.setLngLat([lon, lat]);
    }
  }

  /* load marker from URL, if given */
  map.on('load', ()=>{
    if(getURLCoords()){
      setMarker(startPos[0], startPos[1]);
      map.flyTo({center:startPos, zoom:16});
    }
  });

  /* GPS button */
  document.getElementById('geoBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){
      alert('Geolocation isn’t supported by this browser.'); return;
    }
    navigator.geolocation.getCurrentPosition(pos=>{
              const {longitude, latitude} = pos.coords;
              setMarker(longitude, latitude);
              map.flyTo({center:[longitude, latitude], zoom:16});
            }, err=>alert('Couldn’t get your position: '+err.message),
            {enableHighAccuracy:true, timeout:10000});
  });

  /* simple click-to-share */
  map.on('click', e=>{
    const {lng, lat} = e.lngLat;
    setMarker(lng, lat);
    shareURL(lng, lat);
  });
</script>
</body>
</html>
